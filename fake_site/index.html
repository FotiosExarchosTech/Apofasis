<style>
#popup{
    background-color: black;
    color: white;
    border: 1px solid white;
}

/* Dark overlay */
.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
    opacity: 0;
    visibility: hidden;
    transition: 0.3s ease;
    z-index: 9998;
}

.overlay.active {
    opacity: 1;
    visibility: visible;
}

/* Sliding Chat Panel */
.chat-modal {
    position: fixed;
    top: 0;
    left: -400px;
    width: 400px;
    height: 100%;
    background: white;
    box-shadow: 5px 0 20px rgba(0,0,0,0.3);
    transition: left 0.4s ease;
    z-index: 9999;
}

.chat-modal.open {
    left: 0;
}

.chat-modal iframe {
    width: 100%;
    height: 100%;
    border: none;
}

.close-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 22px;
    cursor: pointer;
    z-index: 10000;
}
</style>
</head>

<script>
// Chat open / close
const popupBtn = document.getElementById("popup");
const modal = document.getElementById("chatModal");
const closeBtn = document.querySelector(".close-btn");
const overlay = document.getElementById("overlay");

popupBtn.addEventListener("click", () => {
    modal.classList.add("open");
    overlay.classList.add("active");
});

function closeChat(){
    modal.classList.remove("open");
    overlay.classList.remove("active");
}

closeBtn.addEventListener("click", closeChat);
overlay.addEventListener("click", closeChat);
</script>

        const grid = document.getElementById('product-grid');
        const title = document.getElementById('category-title');

        
        function displayProducts(items) {
            grid.innerHTML = '';
            items.forEach(product => {
                grid.innerHTML += `
                    <div class="col">
                        <div class="card h-100 shadow-sm border-0 product-card">
                            <img src="${product.image}" class="card-img-top">
                            <div class="card-body d-flex flex-column">
                                <small class="text-muted text-uppercase fw-bold">${product.brand}</small>
                                <h5 class="card-title mt-1">${product.title}</h5>
                                <p class="text-danger fw-bold fs-5">${product.price}</p>
                                <a href="product.html?id=${product.id}" class="btn btn-primary mt-auto">Δες το</a>
                            </div>
                        </div>
                    </div>`;
            });
        }

        // filters
        function filterProducts(category, btn) {
            document.querySelectorAll('.btn-outline-dark').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if (category === 'all') {
                title.innerText = "Όλα τα Προϊόντα";
                displayProducts(products);
            } else {
                title.innerText = category.charAt(0).toUpperCase() + category.slice(1);
                const filtered = products.filter(p => p.category === category);
                displayProducts(filtered);
            }
        }

        displayProducts(products);
</script>
