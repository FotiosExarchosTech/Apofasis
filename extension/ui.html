<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Apofasis AI Chat</title>
    <link rel="stylesheet" href="ui.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-brain"></i> Apofasis AI
        </div>
        <button id="clear-chat" title="Καθαρισμός Chat"><i class="fa-solid fa-trash-can"></i></button>
    </header>

    <main id="chat-box">
        <div class="message ai-message">
            <div class="message-content">
                Γεια σου!👋<br> Πώς μπορώ να βοηθήσω; 
            </div>
        </div>
    </main>

    <footer>
        <div class="input-container">
            <textarea id="user-input" placeholder="Γράψε την ερώτησή σου..." rows="1"></textarea>
            <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </footer>

    <script src="ui.js"></script>
</body>
</html>
